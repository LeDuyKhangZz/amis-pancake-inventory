name: Inventory sync

on:
  schedule:
    - cron: '*/5 * * * *'
  workflow_dispatch:
    inputs:
      mode:
        description: 'preview only reads; commit updates Pancake'
        type: choice
        default: preview
        options: [preview, commit]

permissions:
  contents: read
  id-token: write

concurrency:
  group: inventory-sync-production
  cancel-in-progress: false

jobs:
  sync:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - name: Obtain short-lived GitHub identity token and call sync
        shell: bash
        env:
          MODE: ${{ inputs.mode || 'preview' }}
        run: |
          set -euo pipefail
          oidc_response=$(curl --fail --silent --show-error \
            -H "Authorization: Bearer $ACTIONS_ID_TOKEN_REQUEST_TOKEN" \
            "$ACTIONS_ID_TOKEN_REQUEST_URL&audience=amis-pancake-inventory-sync")
          oidc_token=$(node -e 'const fs=require("fs"); process.stdout.write(JSON.parse(fs.readFileSync(0,"utf8")).value)' <<<"$oidc_response")
          curl --fail --silent --show-error \
            -X POST \
            -H "Authorization: Bearer $oidc_token" \
            -H "Content-Type: application/json" \
            --data "{\"mode\":\"$MODE\"}" \
            https://amis-pancake-inventory-ten.vercel.app/api/github-sync
